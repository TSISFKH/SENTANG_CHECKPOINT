<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forum | SENTANG CHECKPOINT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================ -->
    <!-- HEADER -->
    <!-- ================================ -->

    <header>

        <h1>SENTANG CHECKPOINT</h1>

        <nav>
            <nav>

    <a href="index.html">
        หน้าแรก
    </a>

    <a href="test.html">
        ค้นหาเส้นทาง
    </a>

    <a href="universities.html">
        มหาวิทยาลัย
    </a>

    <a href="careers.html">
        อาชีพ
    </a>

    <a href="forum.html">
        กระทู้
    </a>

    <a href="login.html" id="accountNav">
        เข้าสู่ระบบ
    </a>

    </nav>
        </nav>

    </header>


    <!-- ================================ -->
    <!-- MAIN -->
    <!-- ================================ -->

    <main>

        <section>

            <h2>กระทู้พูดคุย</h2>

            <p>
                แลกเปลี่ยนความคิดเห็น
                สอบถามเรื่องการเรียน มหาวิทยาลัย
                คณะ และเส้นทางอาชีพ
            </p>

        </section>


        <!-- ================================ -->
        <!-- CREATE POST -->
        <!-- ================================ -->

        <section>

            <h3>สร้างกระทู้ใหม่</h3>

            <form id="createPostForm">

                <div>
                    <label for="postTitle">
                        ชื่อกระทู้
                    </label>

                    <input
                        type="text"
                        id="postTitle"
                        placeholder="กรอกชื่อกระทู้"
                        required
                    >
                </div>


                <div>
                    <label for="postAuthor">
                        ชื่อผู้โพสต์
                    </label>

                    <input
                        type="text"
                        id="postAuthor"
                        placeholder="กรอกชื่อของคุณ"
                        required
                    >
                </div>


                <div>
                    <label for="postContent">
                        เนื้อหา
                    </label>

                    <textarea
                        id="postContent"
                        placeholder="เขียนรายละเอียดกระทู้..."
                        required
                    ></textarea>
                </div>


                <button type="submit">
                    สร้างกระทู้
                </button>

            </form>

            <p id="createPostMessage"></p>

        </section>


        <!-- ================================ -->
        <!-- POST LIST -->
        <!-- ================================ -->

        <section>

            <h3>กระทู้ทั้งหมด</h3>

            <div id="forumList">

                <p>
                    กำลังโหลดกระทู้...
                </p>

            </div>

        </section>


        <!-- ================================ -->
        <!-- POST DETAIL -->
        <!-- ================================ -->

        <section id="postDetailSection" hidden>

            <h3 id="detailTitle"></h3>

            <p id="detailAuthor"></p>

            <p id="detailDate"></p>

            <div id="detailContent"></div>


            <hr>


            <h4>ความคิดเห็น</h4>

            <div id="replyList">
                <p>ยังไม่มีความคิดเห็น</p>
            </div>


            <!-- ================================ -->
            <!-- REPLY FORM -->
            <!-- ================================ -->

            <form id="replyForm">

                <div>

                    <label for="replyAuthor">
                        ชื่อผู้ตอบ
                    </label>

                    <input
                        type="text"
                        id="replyAuthor"
                        placeholder="กรอกชื่อของคุณ"
                        required
                    >

                </div>


                <div>

                    <label for="replyContent">
                        ความคิดเห็น
                    </label>

                    <textarea
                        id="replyContent"
                        placeholder="เขียนความคิดเห็น..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    แสดงความคิดเห็น
                </button>

            </form>


            <p id="replyMessage"></p>

        </section>

    </main>


    <!-- ================================ -->
    <!-- JAVASCRIPT -->
    <!-- ================================ -->

    <script src="forum.js"></script>

<script>

async function updateAccountNav() {

    const accountNav =
        document.getElementById("accountNav");

    if (!accountNav) {
        return;
    }

    const token =
        localStorage.getItem("sentangToken");


    // ยังไม่ได้ Login
    if (!token) {

        accountNav.textContent =
            "เข้าสู่ระบบ";

        accountNav.href =
            "login.html";

        return;
    }


    // ตรวจสอบ Login กับ Server
    try {

        const response =
            await fetch(
                "https://sentang-checkpoint-api.onrender.com/api/auth/me",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (
            response.ok &&
            result.success
        ) {

            accountNav.textContent =
                "👤 บัญชีของฉัน";

            accountNav.href =
                "account.html";

            localStorage.setItem(
                "sentangUser",
                JSON.stringify(result.user)
            );

            return;
        }


        // Token ใช้ไม่ได้
        localStorage.removeItem(
            "sentangToken"
        );

        localStorage.removeItem(
            "sentangUser"
        );


        accountNav.textContent =
            "เข้าสู่ระบบ";

        accountNav.href =
            "login.html";


    } catch (error) {

        console.error(error);

        accountNav.textContent =
            "เข้าสู่ระบบ";

        accountNav.href =
            "login.html";

    }

}


updateAccountNav();

</script>

</body>
</html>

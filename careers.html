    <meta
        name="viewport"

    >

    <title>
        อาชีพ | SENTANG CHECKPOINT

    <link

        href="style.css"

<body>


<header>

    <div class="logo">

        SENTANG
        <span>CHECKPOINT</span>

    </div>


    <nav>

        <a href="index.html">
            หน้าแรก
        </a>

        <a href="test.html">
            ค้นหาเส้นทาง
        </a>

        <a href="universities.html">

        <a

        </a>

    </nav>

</header>



<main>


    <!-- =========================
         HEADER
    ========================== -->

    <section class="career-header">

        <p class="subtitle">
            CAREER
        </p>


        <h1>
            ค้นหาอาชีพที่ใช่
        </h1>


        <p>
            สำรวจอาชีพต่าง ๆ
            และค้นหาเส้นทางการเรียนที่เหมาะกับคุณ
        </p>

    </section>



    <!-- =========================
         SEARCH
    ========================== -->

    <section class="career-search">


        <div class="search-box">

            🔎

            <input
                type="text"
                id="careerSearch"
                placeholder="ค้นหาอาชีพ เช่น แพทย์ นักวิจัย โปรแกรมเมอร์..."
            >

        </div>


        <select id="careerCategory">

            <option value="all">
                ทุกหมวดอาชีพ
            </option>

            <option value="health">
                🩺 สุขภาพและการแพทย์
            </option>

            <option value="science">
                🔬 วิทยาศาสตร์และการวิจัย
            </option>

            <option value="technology">
                💻 เทคโนโลยี
            </option>

            <option value="business">
                💼 ธุรกิจ
            </option>

            <option value="creative">
                🎨 ศิลปะและสร้างสรรค์
            </option>

        </select>


    </section>



    <!-- =========================
         CAREER LIST
    ========================== -->

    <section
        id="careerList"
        class="career-grid"
    >

    </section>


</main>



<footer>

    <h3>
        SENTANG CHECKPOINT
    </h3>

    <p>
        ค้นหาตัวเอง ก่อนเลือกเส้นทาง

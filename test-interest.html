<header>

    <div class="logo">
        SENTANG <span>CHECKPOINT</span>
    </div>


    <nav>

        <a href="index.html">

        </a>

        <a href="test.html">

<main>

    <section class="quiz-container">


        <p class="subtitle">
            DISCOVER YOURSELF
        </p>


        <h1>
            แบบทดสอบความสนใจ
        </h1>


        <p class="description">
            เลือกคำตอบที่ตรงกับคุณมากที่สุด
            ไม่มีคำตอบถูกหรือผิด
        </p>


        <!-- แถบความคืบหน้า -->

        <div class="progress-container">

            <div id="progress"></div>

        </div>


        <p id="question-number"></p>


        <!-- คำถาม -->

        <div id="question-box">

            <h2 id="question">
                กำลังโหลดคำถาม...
            </h2>


            <div id="answers"></div>

        </div>


        <!-- ปุ่ม -->

        <button
            id="next-button"
            class="main-button"
            onclick="nextQuestion()"
        >
            ถัดไป →
        </button>


    </section>

</main>



<footer>

    <h3>
        SENTANG CHECKPOINT
    </h3>
